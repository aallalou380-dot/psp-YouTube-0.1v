name: Build PSP YouTube 0.2v

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update package database
        run: |
          psp-pacman -Sy --noconfirm

      - name: Install intraFont
        run: |
          psp-pacman -S --needed --noconfirm libintrafont

      - name: Verify intraFont
        run: |
          echo "Checking intraFont..."
          find /usr/local/pspdev/psp -name '*intraFont*' -o -name '*intrafont*'
          ls -l /usr/local/pspdev/psp/lib/libintrafont.a

      - name: Build
        run: |
          make clean || true
          make

      - name: Prepare release
        run: |
          mkdir -p release/PSP/GAME/PSPYouTube
          cp EBOOT.PBP release/PSP/GAME/PSPYouTube/

      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: PSP-YouTube-0.2v
          path: release/
          if-no-files-found: error