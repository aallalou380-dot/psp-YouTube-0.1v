name: Build PSP App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PSPDEV: /usr/local/pspdev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare PSP toolchain
        run: |
          sudo mkdir -p "$PSPDEV"
          sudo chown -R "$USER:$USER" "$PSPDEV"

          git clone --depth 1 https://github.com/pspdev/psptoolchain.git

          cd psptoolchain

          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"

          ./prepare.sh
          ./toolchain.sh

      - name: Install PSPSDK
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"

          git clone --depth 1 https://github.com/pspdev/pspsdk.git

          cd pspsdk

          ./bootstrap
          ./configure --prefix="$PSPDEV/psp"

          make -j2
          make install

      - name: Install PSP package manager
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libarchive-dev \
            libarchive-tools \
            libcurl4-openssl-dev \
            libgpgme-dev \
            libssl-dev \
            pkg-config \
            meson \
            ninja-build \
            wget

          git clone --depth 1 https://github.com/pspdev/psp-pacman.git

          cd psp-pacman

          ./build-and-install.sh

      - name: Install intraFont
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"

          echo "=== Installing libintrafont ==="

          psp-pacman -Sy --noconfirm libintrafont

          echo "=== Verify intraFont ==="

          find "$PSPDEV" \
            \( -name 'libintraFont.a' -o -name 'libintrafont.a' \) \
            -print

          test -f "$PSPDEV/psp/include/intraFont.h"

      - name: Prepare icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          convert assets/youtube.png \
            -resize 48x48 \
            -background "#101318" \
            -gravity center \
            -extent 144x80 \
            PNG32:ICON0.PNG

      - name: Verify PSP environment
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"

          echo "=== PSP GCC ==="
          psp-gcc --version

          echo "=== PSPSDK ==="
          psp-config --pspsdk-path

          echo "=== intraFont ==="
          find "$PSPDEV/psp" \
            \( -name 'libintraFont.a' -o -name 'libintrafont.a' \) \
            -print

          test -f "$PSPDEV/psp/include/intraFont.h"

      - name: Build
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"

          echo "=== Clean ==="

          make clean || true

          rm -f main.o
          rm -f PSPYouTube.elf
          rm -f PARAM.SFO
          rm -f EBOOT.PBP

          echo "=== Build ==="

          make

          echo "=== Build result ==="

          ls -lh EBOOT.PBP

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: PSPYouTube-0.2v-modern-ui
          path: EBOOT.PBP