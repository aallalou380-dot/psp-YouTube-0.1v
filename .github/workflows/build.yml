name: Build PSP App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PSPDEV
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"

          echo "=== PSPDEV ==="
          echo "$PSPDEV"

          echo "=== PSP GCC ==="
          psp-gcc --version

          echo "=== PSPSDK ==="
          psp-config --pspsdk-path

      - name: Install intraFont
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"

          echo "=== Updating PSP package database ==="
          psp-pacman -Sy --noconfirm

          echo "=== Installing intraFont ==="
          psp-pacman -S --noconfirm libintrafont

          echo "=== Checking intraFont ==="
          find "$PSPDEV/psp" \
            \( -name 'libintraFont.a' -o -name 'libintrafont.a' \) \
            -print

          test -f "$PSPDEV/psp/include/intraFont.h"

      - name: Verify libraries
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"

          echo "=== intraFont header ==="
          ls -lh "$PSPDEV/psp/include/intraFont.h"

          echo "=== intraFont library ==="
          find "$PSPDEV/psp/lib" \
            \( -name 'libintraFont.a' -o -name 'libintrafont.a' \) \
            -print

          echo "=== Checking required files ==="

          test -f "$PSPDEV/psp/include/intraFont.h"

          if [ -f "$PSPDEV/psp/lib/libintraFont.a" ]; then
            echo "FOUND: libintraFont.a"
          elif [ -f "$PSPDEV/psp/lib/libintrafont.a" ]; then
            echo "FOUND: libintrafont.a"
          else
            echo "ERROR: intraFont library not found"
            exit 1
          fi

      - name: Build
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"

          echo "=== Clean ==="

          make clean || true

          rm -f main.o
          rm -f PSPYouTube.elf
          rm -f PARAM.SFO
          rm -f EBOOT.PBP

          echo "=== Build PSP YouTube 0.2v ==="

          make

          echo "=== Build result ==="

          ls -lh EBOOT.PBP

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: PSPYouTube-0.2v-modern-ui
          path: EBOOT.PBP