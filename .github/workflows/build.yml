name: Build PSP YouTube 0.2v

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-psp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PSP YouTube
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout PocketJS
        uses: actions/checkout@v4
        with:
          repository: pocket-nexus/pocketjs
          path: pocketjs

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install PocketJS dependencies
        working-directory: pocketjs
        run: bun install

      - name: Setup PocketJS PSP toolchain
        working-directory: pocketjs
        run: bun run bootstrap

      - name: Install PocketJS CLI
        run: npm install -g @pocketjs/cli

      - name: Copy PSP YouTube into PocketJS
        run: |
          mkdir -p pocketjs/apps/psp-youtube
          cp -r app pocketjs/apps/psp-youtube/
          cp pocket.json pocketjs/apps/psp-youtube/

      - name: Check PSP YouTube
        working-directory: pocketjs
        run: |
          pocket check \
            --target psp \
            --manifest apps/psp-youtube/pocket.json

      - name: Build PSP YouTube
        working-directory: pocketjs
        run: |
          pocket build \
            --target psp \
            --manifest apps/psp-youtube/pocket.json \
            -- --release

      - name: Find EBOOT.PBP
        run: |
          find pocketjs -type f -name "EBOOT.PBP" -print

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: PSP-YouTube-0.2v-EBOOT
          path: "pocketjs/**/EBOOT.PBP"
          if-no-files-found: error