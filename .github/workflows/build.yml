name: Build PSP App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PSPDEV: /usr/local/pspdev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare PSP toolchain
        run: |
          sudo mkdir -p /usr/local/pspdev
          sudo chown -R "$USER:$USER" /usr/local/pspdev

          git clone --depth 1 https://github.com/pspdev/psptoolchain.git

          cd psptoolchain

          export PSPDEV=/usr/local/pspdev
          export PATH=$PSPDEV/bin:$PATH

          ./prepare.sh
          ./toolchain.sh

      - name: Install PSPSDK
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH=$PSPDEV/bin:$PATH

          git clone --depth 1 https://github.com/pspdev/pspsdk.git

          cd pspsdk

          ./bootstrap

          ./configure --prefix="$PSPDEV/psp"

          make -j2

          make install

      - name: Verify PSP development environment
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH=$PSPDEV/bin:$PATH

          echo "=== PSP GCC ==="
          psp-gcc --version

          echo "=== PSP CONFIG ==="
          psp-config --pspsdk-path

      - name: Prepare YouTube icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          mkdir -p assets

          echo "=== Checking source icon ==="
          ls -lh assets/youtube.png
          identify assets/youtube.png

          echo "=== Creating ICON0.PNG ==="

          convert assets/youtube.png \
            -trim \
            +repage \
            -resize 144x80 \
            -background "#000000" \
            -gravity center \
            -extent 144x80 \
            PNG32:ICON0.PNG

          echo "=== Creating youtube.raw ==="

          convert assets/youtube.png \
            -resize 48x48! \
            -depth 8 \
            RGBA:assets/youtube.raw

          echo "=== Generated files ==="
          identify ICON0.PNG
          ls -lh assets/youtube.png
          ls -lh assets/youtube.raw
          ls -lh ICON0.PNG

      - name: Build PSP application
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH=$PSPDEV/bin:$PATH

          echo "=== Source verification ==="
          grep -n "COLOR_RED" main.c

          echo "=== Clean build ==="
          make clean || true
          rm -f main.o youtube_raw.o EBOOT.PBP

          echo "=== Building ==="
          make

          echo "=== Build result ==="
          ls -lh EBOOT.PBP

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: PSPYouTube-0.2v
          path: EBOOT.PBP